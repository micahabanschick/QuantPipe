name: Deploy to Banschick Toolset

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy QuantPipe to server
        uses: appleboy/ssh-action@v1
        with:
          host: 87.99.133.129
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/banschick-toolset/apps/quantpipe && git pull origin main
            cd /opt/banschick-toolset && docker compose up -d --build quantpipe
